bancoPalabras: true
texto: |
  {{1}} she researched every decision carefully. {{2}}, one day, she decided to quit her
  job. {{3}} she handed in her resignation, she felt her hands shaking. {{4}}, she took a
  deep breath and walked into her boss's office. {{5}}, she realised there was no turning
  back. {{6}} of her decision, she started her own business. {{7}}, her colleagues
  couldn't believe the news. {{8}}, the phone rang - it was her first client! {{9}}, the
  business grew and she hired a team. {{10}}, it was the best decision she had ever made.
