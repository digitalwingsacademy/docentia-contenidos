criterios:
  - "The letter uses past simple and past continuous correctly."
  - "Used to is used appropriately (if relevant)."
  - "Sequence connectors are used correctly."
  - "Cause-result connectors are present (as a result, because...)."
  - "The register is consistently informal (contractions, friendly tone)."
  - "The letter has a clear structure: opening, news, details, closing."
  - "Vocabulary includes 3+ items from the unit (emotions, life events, phrasal verbs)."
  - "Spelling and punctuation are generally accurate."
